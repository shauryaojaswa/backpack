<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint Admin – Kitchen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="admin-app">
    <div id="login-screen" class="screen active">
      <div class="logo">CHECKP<span class="logo-o" aria-label="O"></span>INT<span class="logo-sub">Backpacker Hostel</span></div>
      <div class="tagline">Kitchen Control</div>
      <div class="welcome-card">
        <h2>Welcome, Chef!</h2>
        <p class="hero-text">Sign in to manage orders and the menu.</p>
        <label for="email">Username / Email</label>
        <input type="text" id="email" placeholder="admin">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <button id="login-btn" class="primary">Sign In →</button>
        <button id="create-admin-btn" class="ghost">✚ Create Admin (first time only)</button>
        <p id="login-feedback"></p>
        <p class="small-note" style="text-align:center;">username: admin · password: admin@12345</p>
      </div>
    </div>

    <div id="dashboard-screen" class="screen">
      <div class="logo small">CHECKP<span class="logo-o" aria-label="O"></span>INT<span class="logo-sub">Kitchen Dashboard</span></div>
      <div class="admin-header">
        <h2><span id="live-dot" class="live-dot"></span>★ Kitchen Dashboard</h2>
        <div class="admin-actions">
          <button id="logout-btn" class="ghost">Logout</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="orders">🍽️ Orders</button>
        <button class="admin-tab" data-tab="menu">📋 Menu Management</button>
      </div>

      <div class="admin-panel active" id="orders-panel">
        <div id="orders-list"></div>
      </div>

      <div class="admin-panel" id="menu-panel">
        <div class="menu-form-card">
          <h3>✚ Add New Menu Item</h3>
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g. Paneer Masala">
          <div class="form-row">
            <div>
              <label for="item-price">Price (₹)</label>
              <input type="number" id="item-price" placeholder="150" min="0">
            </div>
            <div>
              <label for="item-category">Category</label>
              <select id="item-category">
                <option value="Breakfast">☀️ Breakfast</option>
                <option value="Lunch">🍽️ Lunch</option>
                <option value="Dinner">🌙 Dinner</option>
              </select>
            </div>
          </div>
          <label for="item-description">Description (optional)</label>
          <input type="text" id="item-description" placeholder="e.g. Cottage cheese curry with 4 rotis">
          <div class="form-actions">
            <button id="add-menu-btn" class="primary">✚ Add Item</button>
          </div>
        </div>
        <h3>Current Menu</h3>
        <div id="menu-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
